services:
  - type: web
    name: leadgen-lite
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadgen-lite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: SEARCH_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: leadgen-lite-db
    plan: free
    databaseName: leadgen_lite
    user: leadgen_user
